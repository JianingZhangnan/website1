<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>费米气体交互图</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f4ec;
        --ink: #26241e;
        --muted: #514c40;
        --line: #d4cdbc;
        --accent: #a94f2d;
        --blue: #245b8a;
        --green: #28684c;
        --purple: #75458b;
        --panel: #fffdf7;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --paper: #20201f;
        --ink: #f0efec;
        --muted: #d0cbbd;
        --line: #575345;
        --accent: #ef9874;
        --blue: #8fc6f4;
        --green: #8ed0a9;
        --purple: #d0a5ec;
        --panel: #292824;
      }
      * {
        box-sizing: border-box;
      }
      html[data-embedded="true"] {
        overflow: hidden;
      }
      body {
        margin: 0;
        padding: 16px 12px;
        color: var(--ink);
        background: var(--paper);
        font:
          15px/1.7 system-ui,
          "Microsoft YaHei",
          sans-serif;
      }
      main {
        max-width: 980px;
        margin: auto;
        border-top: 3px solid var(--accent);
        padding-top: 12px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 21px;
        line-height: 1.45;
      }
      p {
        margin: 6px 0 12px;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.12em;
        font-weight: 700;
      }
      .intro,
      .hint {
        color: var(--muted);
        font-size: 14px;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 20px;
        margin: 15px 0;
      }
      label {
        display: block;
        font-weight: 600;
      }
      label output {
        float: right;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
        min-height: 30px;
      }
      select,
      button {
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 7px 10px;
        font: inherit;
      }
      select {
        width: 100%;
      }
      button {
        cursor: pointer;
      }
      button:hover,
      button[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--paper);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin: 10px 0 14px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 400;
      }
      input[type="checkbox"] {
        width: 17px;
        height: 17px;
        accent-color: var(--accent);
      }
      .graph {
        position: relative;
        width: 100%;
        overflow: hidden;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
        touch-action: pan-y;
      }
      svg text {
        fill: var(--muted);
        font:
          14px system-ui,
          sans-serif;
      }
      svg .grid {
        stroke: var(--line);
        stroke-width: 0.7;
      }
      svg .axis {
        stroke: var(--muted);
        stroke-width: 1;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 18px;
        font-size: 13px;
        margin: 9px 0;
      }
      .legend span::before {
        content: "";
        display: inline-block;
        width: 20px;
        border-top: 3px solid var(--curve);
        margin-right: 6px;
        vertical-align: middle;
      }
      .legend .dash::before {
        border-top-style: dashed;
      }
      .readout {
        border-left: 3px solid var(--accent);
        padding: 9px 12px;
        background: var(--panel);
        margin: 12px 0;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .values {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px 16px;
      }
      .formula {
        font-family: "Cambria Math", Georgia, serif;
        font-size: 17px;
      }
      footer {
        font-size: 12px;
        color: var(--muted);
        margin-top: 14px;
      }
      a {
        color: var(--accent);
      }
      @media (max-width: 500px) {
        body {
          padding: 12px 5px;
        }
        h1 {
          font-size: 19px;
        }
        .controls {
          grid-template-columns: 1fr;
          gap: 7px;
        }
        svg text {
          font-size: 16px;
        }
        .values {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      ;(() => {
        "use strict"
        document.documentElement.dataset.embedded = parent !== window ? "true" : "false"
        const requested = new URLSearchParams(location.search).get("mode")
        const mode = ["occupation", "integrals", "limit"].includes(requested)
          ? requested
          : "occupation"
        const app = document.getElementById("app")
        const colors = ["var(--blue)", "var(--green)", "var(--accent)", "var(--purple)"]
        const fmt = (v) =>
          (Math.abs(v) < 0.001 && v !== 0) || Math.abs(v) >= 10000
            ? v.toExponential(3)
            : Number(v.toPrecision(5)).toString()
        function sigmoid(a) {
          return a >= 0 ? 1 / (1 + Math.exp(-a)) : Math.exp(a) / (1 + Math.exp(a))
        }
        const gamma = {
          ".5": Math.sqrt(Math.PI),
          0.5: Math.sqrt(Math.PI),
          1: 1,
          1.5: Math.sqrt(Math.PI) / 2,
          2.5: (3 * Math.sqrt(Math.PI)) / 4,
        }
        // x = t² removes the integrable x^(-1/2) endpoint for nu = 1/2.
        function fd(nu, eta) {
          if (nu === 1)
            return eta > 0 ? eta + Math.log1p(Math.exp(-eta)) : Math.log1p(Math.exp(eta))
          const upper = Math.sqrt(Math.max(eta, 0) + 44),
            count = Math.max(512, Math.ceil((Math.max(eta, 0) + 44) * 12) * 2),
            step = upper / count
          const kernel = (t) => (2 * Math.pow(t, 2 * nu - 1) * sigmoid(eta - t * t)) / gamma[nu]
          let sum = kernel(0) + kernel(upper)
          for (let i = 1; i < count; i++) sum += (i % 2 ? 4 : 2) * kernel(i * step)
          return (sum * step) / 3
        }
        function asymptotic(nu, eta) {
          return (
            (Math.pow(eta, nu) / (nu * gamma[nu])) *
            (1 + ((Math.PI ** 2 / 6) * nu * (nu - 1)) / eta ** 2)
          )
        }
        const range = (id, label, min, max, step, value) =>
          `<label for="${id}">${label}<output id="${id}-value"></output><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"></label>`
        const shell = (number, title, intro, controls, presets) =>
          `<div class="eyebrow">交互图 ${number} / 03</div><h1>${title}</h1><p class="intro">${intro}</p><div class="controls">${controls}</div><div class="presets">${presets}</div><div class="graph"><svg id="plot" viewBox="0 0 760 380" role="img" aria-labelledby="plot-title plot-desc"><title id="plot-title">${title}</title><desc id="plot-desc"></desc></svg></div><div class="legend" id="legend"></div><div id="readout" class="readout" role="status" aria-live="polite"></div><p class="hint" id="hint"></p><footer>改变滑块或点击预设；图像即时更新。<a id="standalone" target="_blank" rel="noopener">单独打开此图</a></footer>`
        if (mode === "occupation") {
          app.innerHTML = shell(
            "01",
            "单个态的占据：温度展宽，化学势平移",
            "横轴是能量 E，曲线是每个单粒子态的平均占据数。E₀ 为固定的能量单位，不随温度变化。",
            range("tau", "kᴮT / E₀", 0.005, 1, 0.005, 0.15) +
              range("mu", "μ / E₀", -0.5, 2, 0.01, 1) +
              range("probe", "取样能量 E / E₀", 0, 3, 0.01, 1) +
              `<label class="check"><input id="compare" type="checkbox" checked>叠加同一 μ 下的多种温度</label>`,
            `<button data-preset="cold">窄过渡</button><button data-preset="warm">热展宽</button><button data-preset="negative">负化学势</button>`,
          )
        } else if (mode === "limit") {
          app.innerHTML = shell(
            "03",
            "从平滑曲线到零温阶跃",
            "横轴固定为 E / Eꜰ。比较 E 与阈值的位置；阶跃条件应写 E &lt; Eꜰ 或 E &gt; Eꜰ，不能写 μ 与 Eꜰ 的比较。",
            range("tau", "T / Tꜰ", 0, 0.6, 0.002, 0.08) +
              `<label for="ensemble">保持什么不变<select id="ensemble"><option value="fixed-mu">固定 μ = Eꜰ：单独看温度极限</option><option value="fixed-n">固定密度：数值求解 μ(T)</option></select></label>` +
              range("probe", "取样能量 E / Eꜰ", 0, 2, 0.005, 0.85) +
              `<label class="check"><input id="compare" type="checkbox" checked>叠加 T / Tꜰ = 0.25、0.10、0.03</label>`,
            `<button data-temp=".25">T / Tꜰ = 0.25</button><button data-temp=".08">0.08</button><button data-temp=".01">0.01</button><button data-temp="0">零温极限</button>`,
          )
        } else {
          app.innerHTML = shell(
            "02",
            "费米积分：不同阶数与不同逸度",
            "这里的 fν(z) 已经对能量积分，不受 0 到 1 的占据上限约束。虚线只在相应的近似区域绘出。",
            range("eta", "η = ln z", -8, 12, 0.05, 0) +
              `<label for="nu">强调的阶数 ν<select id="nu"><option value=".5">1/2</option><option value="1">1</option><option value="1.5" selected>3/2 · 粒子数</option><option value="2.5">5/2 · 压强</option></select></label><label for="axis">横轴<select id="axis"><option value="eta">ln z：看高温到低温的全程</option><option value="z">z：看逸度的直接变化</option></select></label><label class="check"><input id="logy" type="checkbox">对数纵轴：放大小逸度区</label>`,
            `<button data-eta="-5">经典区 z ≪ 1</button><button data-eta="0">z = 1</button><button data-eta="4">ln z = 4</button><button data-eta="10">大逸度区</button>`,
          )
        }
        document.getElementById("standalone").href = location.href
        const el = (id) => document.getElementById(id)
        const number = (id) => Number(el(id).value)
        function plot(curves, options) {
          const svg = el("plot"),
            W = Math.max(320, Math.min(760, el("plot").parentElement.clientWidth)),
            H = W < 500 ? 340 : 380,
            L = 62,
            R = 20,
            T = 22,
            B = 53
          svg.setAttribute("viewBox", `0 0 ${W} ${H}`)
          const { xmin, xmax, ymin, ymax, xlabel, ylabel, xticks, yticks, marker, threshold } =
            options
          const X = (x) => L + ((x - xmin) / (xmax - xmin)) * (W - L - R),
            Y = (y) => H - B - ((y - ymin) / (ymax - ymin)) * (H - T - B)
          let html = `<title id="plot-title">${options.title}</title><desc id="plot-desc">${options.desc}</desc><defs><clipPath id="clip"><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/></clipPath></defs>`
          for (const [x, label] of xticks)
            html += `<line class="grid" x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${H - B}"/><text text-anchor="${x === xmin ? "start" : x === xmax ? "end" : "middle"}" x="${X(x)}" y="${H - B + 24}">${label}</text>`
          for (const [y, label] of yticks)
            html += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}"/><text text-anchor="end" x="${L - 9}" y="${Y(y) + 5}">${label}</text>`
          html += `<text x="${L}" y="15">${ylabel}</text><text text-anchor="end" x="${W - R}" y="${H - 8}">${xlabel}</text><g clip-path="url(#clip)">`
          if (threshold !== undefined)
            html += `<line x1="${X(threshold)}" x2="${X(threshold)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 5"/>`
          for (const c of curves) {
            const path = c.points
              .filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y))
              .map(([x, y], i) => (i ? "L" : "M") + X(x).toFixed(2) + "," + Y(y).toFixed(2))
              .join(" ")
            html += `<path d="${path}" fill="none" stroke="${c.color}" stroke-width="${c.width || 2.5}" ${c.dash ? 'stroke-dasharray="7 5"' : ""} />`
          }
          if (marker)
            html += `<line x1="${X(marker[0])}" x2="${X(marker[0])}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="2 4"/><circle cx="${X(marker[0])}" cy="${Y(marker[1])}" r="5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>`
          svg.innerHTML = html + `</g>`
          el("legend").innerHTML = curves
            .map(
              (c) =>
                `<span class="${c.dash ? "dash" : ""}" style="--curve:${c.color}">${c.label}</span>`,
            )
            .join("")
        }
        const samples = (lo, hi, n, fn) =>
          Array.from({ length: n + 1 }, (_, i) => {
            const x = lo + ((hi - lo) * i) / n
            return [x, fn(x)]
          })
        function chemicalPotential(tau) {
          if (tau === 0) return 1
          let lo = -50,
            hi = Math.max(50, 2 / tau)
          const target = (4 / (3 * Math.sqrt(Math.PI))) * Math.pow(tau, -1.5)
          for (let i = 0; i < 65; i++) {
            const mid = (lo + hi) / 2
            if (fd(1.5, mid) < target) lo = mid
            else hi = mid
          }
          return (tau * (lo + hi)) / 2
        }
        function update() {
          for (const input of document.querySelectorAll('input[type="range"]'))
            el(input.id + "-value").textContent = fmt(Number(input.value))
          if (mode === "integrals") return drawIntegrals()
          const limit = mode === "limit",
            tau = number("tau"),
            probe = number("probe")
          const fixedN = limit && el("ensemble").value === "fixed-n"
          const mu = limit ? (fixedN ? chemicalPotential(tau) : 1) : number("mu")
          const value = (e, t, m) =>
            t === 0 ? (e < m ? 1 : e > m ? 0 : 0.5) : sigmoid((m - e) / t)
          const xmax = limit ? 2 : 3,
            curves = []
          if (el("compare").checked)
            for (const [i, t] of (limit ? [0.25, 0.1, 0.03] : [0.05, 0.3, 0.8]).entries()) {
              const m = fixedN ? chemicalPotential(t) : mu
              curves.push({
                label: `${limit ? "T/Tꜰ" : "kᴮT/E₀"} = ${t}`,
                color: [colors[0], colors[1], colors[3]][i],
                points: samples(0, xmax, 600, (e) => value(e, t, m)),
              })
            }
          if (limit)
            curves.push({
              label: "零温阶跃 θ(Eꜰ − E)",
              color: "var(--muted)",
              dash: true,
              points: [
                [0, 1],
                [1, 1],
                [1, 0],
                [2, 0],
              ],
            })
          curves.push({
            label: `当前曲线 · ${fmt(tau)}`,
            color: colors[2],
            width: 3.5,
            points:
              tau === 0
                ? [
                    [0, 1],
                    [mu, 1],
                    [mu, 0],
                    [xmax, 0],
                  ]
                : samples(0, xmax, 800, (e) => value(e, tau, mu)),
          })
          const f = value(probe, tau, mu),
            exponent = tau ? (probe - mu) / tau : null
          plot(curves, {
            xmin: 0,
            xmax,
            ymin: -0.03,
            ymax: 1.05,
            xlabel: limit ? "E / Eꜰ" : "E / E₀",
            ylabel: "f(E)",
            xticks: (limit ? [0, 0.5, 1, 1.5, 2] : [0, 0.5, 1, 1.5, 2, 2.5, 3]).map((x) => [x, x]),
            yticks: [0, 0.25, 0.5, 0.75, 1].map((y) => [y, y]),
            marker: [probe, f],
            threshold: mu,
            title: "费米占据函数随能量变化",
            desc: `温度参数 ${tau}，化学势 ${fmt(mu)}。取样能量 ${probe} 的占据数 ${fmt(f)}。`,
          })
          el("readout").innerHTML =
            `<div class="formula">f(E) = 1 / [exp((E − μ) / kᴮT) + 1]</div>μ / ${limit ? "Eꜰ" : "E₀"} = <b>${fmt(mu)}</b>；取样处 f = <b>${fmt(f)}</b>${exponent === null ? "" : `；指数 = <b>${fmt(exponent)}</b>`}`
          el("hint").textContent = limit
            ? tau === 0
              ? "零温时，阈值左边填满、右边为空。图中的竖线只表示跳跃，不是额外一组态；边界点按 1/2 作图。"
              : fixedN
                ? "当前曲线每次通过粒子数积分求 μ(T)，保持密度固定；虚线位置始终是零温的 Eꜰ。T 下降时 μ(T) → Eꜰ。"
                : "固定 μ = Eꜰ：当 E < μ，指数随降温趋于负无穷，f → 1；E > μ 时相反，f → 0；E = μ 时始终为 1/2。"
            : "虚线标出 E = μ；任何非零温度都在这里经过 f = 1/2。μ < 0 时，半占据点落在物理能谱 E ≥ 0 的左侧。"
          resize()
        }
        let integralCache = new Map()
        function drawIntegrals() {
          const eta = number("eta"),
            nu = number("nu"),
            direct = el("axis").value === "z",
            logy = el("logy").checked
          const z = Math.exp(eta),
            xmax = direct ? Math.max(10, z * 1.2) : 12,
            xmin = direct ? 0 : -8
          const tx = (x) => (direct ? (x === 0 ? -Infinity : Math.log(x)) : x)
          const transform = (y) => (logy ? Math.log10(Math.max(y, 1e-8)) : y)
          const key = `${direct}-${xmax}`
          if (!integralCache.has(key)) {
            const data = [0.5, 1, 1.5, 2.5].map((v, i) => ({
              nu: v,
              color: colors[i],
              raw: samples(xmin, xmax, 240, (x) => fd(v, tx(x))),
            }))
            if (integralCache.size > 8) integralCache.clear()
            integralCache.set(key, data)
          }
          const data = integralCache.get(key),
            ymaxRaw = Math.max(...data.map((d) => d.raw.at(-1)[1]))
          const ymin = logy ? (direct ? -4 : -4) : 0,
            ymax = logy ? Math.ceil(Math.log10(ymaxRaw)) : ymaxRaw * 1.09
          const curves = data.map((d) => ({
            label: `ν = ${d.nu}`,
            color: d.color,
            width: d.nu === nu ? 3.6 : 2,
            points: d.raw.map(([x, y]) => [x, transform(y)]),
          }))
          curves.push({
            label: "小逸度近似 fν ≈ z（z ≤ 1）",
            color: "var(--muted)",
            dash: true,
            points: samples(direct ? 0 : -8, direct ? 1 : 0, 80, (x) =>
              transform(direct ? x : Math.exp(x)),
            ),
          })
          if (!direct || xmax >= Math.exp(4))
            curves.push({
              label: `ν = ${nu} 的大逸度近似（ln z ≥ 4）`,
              color: colors[2],
              dash: true,
              points: samples(direct ? Math.exp(4) : 4, xmax, 140, (x) =>
                transform(asymptotic(nu, tx(x))),
              ),
            })
          const value = fd(nu, eta),
            xticks = direct
              ? Array.from({ length: 5 }, (_, i) => {
                  const x = (xmax * i) / 4
                  return [x, fmt(x)]
                })
              : [-8, -4, 0, 4, 8, 12].map((x) => [x, x])
          const yticks = logy
            ? Array.from({ length: ymax - ymin + 1 }, (_, i) => [ymin + i, `10^${ymin + i}`])
            : Array.from({ length: 5 }, (_, i) => {
                const y = (ymax * i) / 4
                return [y, fmt(y)]
              })
          plot(curves, {
            xmin,
            xmax,
            ymin,
            ymax,
            xlabel: direct ? "逸度 z" : "η = ln z",
            ylabel: logy ? "log₁₀ fν(z)" : "fν(z)",
            xticks,
            yticks,
            marker: [direct ? z : eta, transform(value)],
            title: "不同阶数的费米积分",
            desc: `ln z = ${eta}，逸度 ${fmt(z)}，阶数 ${nu}，费米积分值 ${fmt(value)}。`,
          })
          el("readout").innerHTML =
            `<div>z = <b>${fmt(z)}</b>；当前 ν = <b>${nu}</b>；fν(z) / z = <b>${fmt(value / z)}</b></div><div class="values">${[0.5, 1, 1.5, 2.5].map((v) => `<span>f${v}(z) = <b>${fmt(fd(v, eta))}</b></span>`).join("")}</div>`
          el("hint").textContent =
            eta < -2
              ? "小逸度区四条曲线接近 z，fν(z)/z 趋于 1。打开对数纵轴可以看清它们如何靠拢。"
              : eta > 4
                ? "大逸度时曲线按 (ln z)ᵛ 增长，不再近似为 z。小逸度幂级数在 z > 1 时不收敛；此图始终从积分求数值。"
                : "fν(z) 连续递增。ν 改变能量积分的权重；这里的函数可以超过 1，与单态占据 f(E) 不同。"
          resize()
        }
        app.addEventListener("input", update)
        app.addEventListener("change", update)
        app.addEventListener("click", (event) => {
          const b = event.target.closest("button")
          if (!b) return
          if (b.dataset.temp !== undefined) el("tau").value = b.dataset.temp
          if (b.dataset.eta !== undefined) el("eta").value = b.dataset.eta
          if (b.dataset.preset) {
            const values = { cold: [0.025, 1], warm: [0.65, 1], negative: [0.2, -0.3] }[
              b.dataset.preset
            ]
            el("tau").value = values[0]
            el("mu").value = values[1]
          }
          update()
        })
        function resize() {
          if (parent !== window)
            parent.postMessage(
              {
                type: "fpks-fermi-height",
                height: Math.ceil(document.documentElement.getBoundingClientRect().height),
              },
              location.origin,
            )
        }
        function setTheme(theme) {
          document.documentElement.dataset.theme = theme
        }
        try {
          setTheme(
            parent.document.documentElement.getAttribute("saved-theme") ||
              (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
          )
        } catch {
          setTheme("light")
        }
        window.addEventListener("message", (event) => {
          if (
            event.source === parent &&
            event.origin === location.origin &&
            event.data?.type === "fpks-fermi-theme"
          ) {
            setTheme(event.data.theme)
            resize()
          }
        })
        new ResizeObserver(resize).observe(document.body)
        let previousWidth = innerWidth
        window.addEventListener("resize", () => {
          if (innerWidth !== previousWidth) {
            previousWidth = innerWidth
            update()
          }
        })
        update()
        // Public numerical core for reproducible checks; no network dependencies.
        window.fermiMath = { fd, chemicalPotential, sigmoid, asymptotic }
      })()
    </script>
  </body>
</html>
