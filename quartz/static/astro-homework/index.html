<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="大学天文学课程明确作业与课堂问题分栏索引，附课件依据、参考解答和提交入口"
    />
    <title>大学天文学作业与课堂问题</title>
    <link rel="stylesheet" href="/static/fpks-math/mathjax.css" />
    <link rel="stylesheet" href="/static/astro-homework/styles.css?v=__STYLE_VERSION__" />
    <script defer src="/astro-homework/homework-data.js?v=__DATA_VERSION__"></script>
    <script defer src="/static/astro-homework/app.js?v=__APP_VERSION__"></script>
  </head>
  <body>
    <a class="skip-link" href="#reader">跳至题目正文</a>
    <header class="site-header">
      <div class="header-inner">
        <svg class="orbit" viewBox="0 0 280 56" fill="none" aria-hidden="true">
          <ellipse cx="148" cy="30" rx="124" ry="20" transform="rotate(-5 148 30)" />
          <ellipse
            cx="148"
            cy="30"
            rx="84"
            ry="12"
            transform="rotate(-5 148 30)"
            stroke-dasharray="3 4"
          />
          <circle cx="114" cy="30" r="2.2" fill="currentColor" />
          <circle cx="242" cy="18" r="3" fill="var(--accent)" />
        </svg>
        <div class="brand">
          <a href="/">FPKS</a><span>/</span>
          <h1>大学天文学作业与课堂问题</h1>
        </div>
        <div class="header-actions">
          <span id="deck-count">3 份课件</span
          ><button id="theme" class="icon-button" type="button" aria-label="切换深浅色">
            主题
          </button>
        </div>
      </div>
    </header>
    <div class="workspace">
      <aside class="chapter-rail" aria-label="课件目录">
        <p class="rail-label">课件章节目录</p>
        <nav id="deck-nav"></nav>
        <p class="rail-foot">
          作业栏收录课件明示提交链接或写有“作业”的题目。课堂问题单列；开放题保留原要求。
        </p>
      </aside>
      <section class="list-pane" aria-label="题目筛选和索引">
        <label class="search"
          ><span class="sr-only">搜索题目</span
          ><input id="query" type="search" placeholder="搜索题号、关键词或课件"
        /></label>
        <div id="filters" class="filter-group" aria-label="题型筛选"></div>
        <div id="summary" class="summary"></div>
        <div class="index-columns">
          <section class="index-column" aria-labelledby="homework-heading">
            <header class="column-heading">
              <h2 id="homework-heading">作业</h2>
              <span id="homework-count"></span>
            </header>
            <p class="column-note">课件明示提交链接，或原文写有“作业”。</p>
            <ol id="homework-list" class="homework-list"></ol>
          </section>
          <section class="index-column" aria-labelledby="question-heading">
            <header class="column-heading">
              <h2 id="question-heading">课堂问题</h2>
              <span id="question-count"></span>
            </header>
            <p class="column-note">提问、思考与推导练习，单独查阅。</p>
            <ol id="question-list" class="homework-list"></ol>
          </section>
        </div>
      </section>
      <main id="reader" class="reading-pane" tabindex="-1">
        <p class="loading">正在载入题库。</p>
      </main>
    </div>
  </body>
</html>
